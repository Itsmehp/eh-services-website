name: CI

on:
  pull_request: {}
  push:
    branches: [main]
    tags: ['v*.*.*']

env:
  IMAGE_NAME: eh-services
  TRIVY_FAIL_SEVERITY: HIGH
  DOCKERHUB_MULTI_ARCH: 'false'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  validate:
    name: Validate (lint / typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'
          run_install: false

      - name: Install dependencies
        run: |
          echo "Attempting pnpm install --frozen-lockfile (will fallback on failure)"
          pnpm install --frozen-lockfile || (
            echo "pnpm install --frozen-lockfile failed; falling back to --no-frozen-lockfile" &&
            pnpm install --no-frozen-lockfile
          )

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  pr-preview:
    name: PR Preview Image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine DockerHub creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "HAS_DOCKER_CREDS=true" >> $GITHUB_ENV
          else
            echo "HAS_DOCKER_CREDS=false" >> $GITHUB_ENV
          fi

      - name: Set IMAGE_REPO (use DOCKERHUB_REPOSITORY if present)
        run: |
          if [ -n "${{ secrets.DOCKERHUB_REPOSITORY }}" ]; then
            echo "IMAGE_REPO=${{ secrets.DOCKERHUB_REPOSITORY }}" >> $GITHUB_ENV
          else
            echo "IMAGE_REPO=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
          fi

      - name: Set up QEMU (optional - for multi-arch)
        # - uses: docker/setup-qemu-action@v2
        run: echo "QEMU setup skipped (uncomment to enable multi-arch)"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPO }}:pr-${{ github.event.pull_request.number }}
          push: false
          load: true

      - name: Save image artifact when no DockerHub creds
        if: ${{ env.HAS_DOCKER_CREDS == 'false' }}
        run: |
          docker save ${{ env.IMAGE_REPO }}:pr-${{ github.event.pull_request.number }} -o image-pr-${{ github.event.pull_request.number }}.tar
        
      - name: Upload image artifact (no creds)
        if: ${{ env.HAS_DOCKER_CREDS == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-image-${{ github.event.pull_request.number }}
          path: image-pr-${{ github.event.pull_request.number }}.tar

      - name: Login to DockerHub (if present)
        if: ${{ env.HAS_DOCKER_CREDS == 'true' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push preview to DockerHub
        if: ${{ env.HAS_DOCKER_CREDS == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPO }}:pr-${{ github.event.pull_request.number }}

  build-and-push:
    name: Build and Push (main / tags)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: validate
    outputs:
      image_ref: ${{ steps.set-image-ref.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure DockerHub credentials
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not found. Failing build-and-push to avoid accidental public push.";
            exit 1;
          fi

      - name: Set IMAGE_REPO (use DOCKERHUB_REPOSITORY if present)
        run: |
          if [ -n "${{ secrets.DOCKERHUB_REPOSITORY }}" ]; then
            echo "IMAGE_REPO=${{ secrets.DOCKERHUB_REPOSITORY }}" >> $GITHUB_ENV
          else
            echo "IMAGE_REPO=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
          fi

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set SHORT_SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set TAGS
        run: |
          echo "TAGS<<EOF" >> $GITHUB_ENV
          echo "${{ env.IMAGE_REPO }}:latest" >> $GITHUB_ENV
          echo "${{ env.IMAGE_REPO }}:sha-${{ env.SHORT_SHA }}" >> $GITHUB_ENV
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "${{ env.IMAGE_REPO }}:${{ github.ref_name }}" >> $GITHUB_ENV
          fi
          echo "EOF" >> $GITHUB_ENV

      - id: set-image-ref
        name: Set IMAGE_REF (sha tag for downstream jobs)
        run: |
          echo "IMAGE_REF=${{ env.IMAGE_REPO }}:sha-${{ env.SHORT_SHA }}" >> $GITHUB_ENV
          echo "image_ref=${{ env.IMAGE_REPO }}:sha-${{ env.SHORT_SHA }}" >> $GITHUB_OUTPUT

      - name: Set BUILD_PLATFORMS based on DOCKERHUB_MULTI_ARCH
        run: |
          if [ "${{ env.DOCKERHUB_MULTI_ARCH }}" = "true" ]; then
            echo "BUILD_PLATFORMS=linux/amd64,linux/arm64" >> $GITHUB_ENV
          else
            echo "BUILD_PLATFORMS=linux/amd64" >> $GITHUB_ENV
          fi

      - name: Build and push (tags)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          tags: ${{ env.TAGS }}

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DockerHub credentials
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "No DockerHub credentials - skipping Trivy scan"
            exit 0
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ needs.build-and-push.outputs.image_ref }}

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0
        with:
          image-ref: ${{ needs.build-and-push.outputs.image_ref }}
          severity: ${{ env.TRIVY_FAIL_SEVERITY }}
          exit-code: '1'

  smoke-test:
    name: Smoke test (run container + healthcheck)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DockerHub credentials
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "No DockerHub credentials - skipping smoke test"
            exit 0
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ needs.build-and-push.outputs.image_ref }}

      - name: Run smoke test
        run: bash scripts/ci-smoke-test.sh "${{ needs.build-and-push.outputs.image_ref }}"

# Notes:
# - Multi-arch builds can be enabled by uncommenting QEMU setup and changing "platforms" to "linux/amd64,linux/arm64".
# - Image name now resolves to DOCKERHUB_REPOSITORY when set, else defaults to ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}.

